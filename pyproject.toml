[project]
name = "sandbox"
version = "0.1.0"
description = "It is a sandbox"
readme = "README.md"
authors = [
    { name = "Taizo Munemura", email = "github@velvet.sakura.ne.jp" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sandbox = "sandbox.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
